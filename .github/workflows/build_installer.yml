name: Build Italian installer (Windows)

# Build manuale da Actions oppure automatica su tag installer-v*.
# Produce DeltaruneItalianInstaller.exe da installer/setup.iss + DeltaSetup.
# Non tocca lang/ -> non interferisce con il workflow zip_lang.yml.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/build_installer.yml"
  push:
    tags:
      - "installer-v*"

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout Italian pack
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: italian-pack
          persist-credentials: false

      - name: Checkout DeltaSetup upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Lazy-Desman/DeltaSetup
          ref: 04dfc66ef489ee8768c5b1ed08fb691ad8d18a62
          path: DeltaSetup
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "10.0.x"

      - name: Setup Inno Setup 6
        run: choco install innosetup --version=6.7.1 --no-progress -y
        shell: powershell

      - name: Apply Italian localization to patcher
        shell: powershell
        run: |
          Copy-Item italian-pack/installer/LocalizedText.it.cs DeltaSetup/DeltaPatcherCLI/DeltaPatcher/LocalizedText.cs -Force
          $csproj = "DeltaSetup/DeltaPatcherCLI/DeltaPatcher/DeltaPatcherCLI.csproj"
          (Get-Content $csproj -Raw) `
            -replace '<NeutralLanguage>en</NeutralLanguage>', '<NeutralLanguage>it</NeutralLanguage>' `
            -replace '<ResourceLanguages>en</ResourceLanguages>', '<ResourceLanguages>it</ResourceLanguages>' `
            -replace '<SatelliteResourceLanguages>en</SatelliteResourceLanguages>', '<SatelliteResourceLanguages>it</SatelliteResourceLanguages>' `
            | Set-Content $csproj -NoNewline

      - name: Publish DeltaPatcherCLI (win-x64, single file)
        shell: powershell
        run: |
          dotnet publish DeltaSetup/DeltaPatcherCLI/DeltaPatcher/DeltaPatcherCLI.csproj -c Release -r win-x64 -m:1
          $pub = "DeltaSetup/DeltaPatcherCLI/DeltaPatcher/bin/Release/net10.0/win-x64/publish/DeltaPatcherCLI.exe"
          if (-not (Test-Path -LiteralPath $pub)) { throw "DeltaPatcherCLI.exe non trovato in $pub" }

      - name: Pack DeltaPatcherCLI.7z + prepare Inno build dir
        shell: powershell
        run: |
          7z a -t7z -mx=9 build/DeltaPatcherCLI.7z ./DeltaSetup/DeltaPatcherCLI/DeltaPatcher/bin/Release/net10.0/win-x64/publish/DeltaPatcherCLI.exe
          New-Item -ItemType Directory build/innosetup -Force | Out-Null
          Copy-Item italian-pack/installer/setup.iss build/innosetup/setup.iss
          Copy-Item italian-pack/installer/*.bmp, italian-pack/installer/*.ico build/innosetup/ -Force
          Copy-Item build/DeltaPatcherCLI.7z build/innosetup/DeltaPatcherCLI.7z
          Get-ChildItem build/innosetup

      - name: Compile installer with Inno Setup
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build/innosetup/setup.iss
          Get-ChildItem build/innosetup/Output

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DeltaruneItalianInstaller
          path: build/innosetup/Output/DeltaruneItalianInstaller.exe

  publish-installer:
    if: startsWith(github.ref, 'refs/tags/installer-v')
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: DeltaruneItalianInstaller
          path: release

      - name: Attach exe to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: release/DeltaruneItalianInstaller.exe
          generate_release_notes: true
